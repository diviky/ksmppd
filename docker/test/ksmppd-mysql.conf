# Docker test: MySQL-only backend

group=ksmppd
log-file=/var/log/ksmppd/ksmppd.log
log-level=0
smpp-port=2345
database-type=mysql
database-config=demo
database-enable-queue=1
database-store-primary=1
id=KANNELSMPP
inbound-queue-threads=2
outbound-queue-threads=2
auth-method=1

group=mysql-connection
id=demo
host=mysql
username=ksmppduser
password=ksmppdpass
database=ksmppd
max-connections=5

group=http-server
port=14010
password=ksmppdpass

group=smpp-routing
routing-method=1
