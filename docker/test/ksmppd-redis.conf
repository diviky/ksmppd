# Docker test: MySQL auth + Redis queues (hybrid)

group=ksmppd
log-file=/var/log/ksmppd/ksmppd-redis.log
log-level=0
smpp-port=2345
database-type=mysql
database-config=demo
database-queue-type=redis
database-queue-config=redis-queue
database-enable-queue=1
database-store-primary=1
database-store-table=smpp_store
database-queue-store-table=smpp_store_queue
id=KANNELSMPP
inbound-queue-threads=2
outbound-queue-threads=2
auth-method=1

group=mysql-connection
id=demo
host=mysql
username=ksmppduser
password=ksmppdpass
database=ksmppd
max-connections=5

group=redis-connection
id=redis-queue
host=redis
port=6379
database=0
max-connections=5

group=http-server
port=14010
password=ksmppdpass

group=smpp-routing
routing-method=1
