# Hybrid: MySQL for auth/routing/users, Redis for message/PDU/DLR queues

group=ksmppd
log-file=/tmp/ksmppd.log
log-level=0
smpp-port=2345
database-type=mysql
database-config=demo
database-queue-type=redis
database-queue-config=redis-queue
database-enable-queue=1
database-store-primary=1
database-store-table=smpp_store
database-queue-store-table=smpp_store_queue
id=KANNELSMPP
inbound-queue-threads=4
outbound-queue-threads=4
auth-method=1

group=mysql-connection
id=demo
host=localhost
username=demouser
password=demopass
database=kannel_smpp_demo
max-connections=5

group=redis-connection
id=redis-queue
host=127.0.0.1
port=6379
database=0
max-connections=5

group=bearerbox-connection
id=KSMPPD
host=localhost
port=14001

group=http-server
port=14010
password=ksmppdpass

group=smpp-routing
routing-method=1
