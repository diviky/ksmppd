# PostgreSQL auth/routing with optional Redis queues

group=ksmppd
log-file=/tmp/ksmppd.log
log-level=0
smpp-port=2345
database-type=postgres
database-config=demo
database-enable-queue=1
database-store-primary=1
database-store-table=smpp_store
database-queue-store-table=smpp_store_queue
id=KANNELSMPP
inbound-queue-threads=4
outbound-queue-threads=4
auth-method=1

group=pgsql-connection
id=demo
host=localhost
port=5432
username=ksmppd
password=ksmppdpass
database=ksmppd
max-connections=5

group=http-server
port=14010
password=ksmppdpass

group=smpp-routing
routing-method=1
